<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle ambient glow spheres -->
  <circle cx="180" cy="120" r="140" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="300" r="160" fill="#f59e0b" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Border line -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Badges / Metadata -->
  <g transform="translate(80, 65)">
    <rect width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">PYTHON 3</text>

    <rect x="122" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="138" cy="14" r="5" fill="#fbbf24"/>
    <text x="152" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">LEARNING LAB</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="160" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    Python <tspan fill="url(#blueGlow)">Fundamentals</tspan> &amp; <tspan fill="url(#yellowGlow)">Drills</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Structured learning journey through core syntax, idiomatic patterns, data structures and algorithms.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 260)">
    <!-- Pill 1 -->
    <rect width="165" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Variables &amp; Types</text>

    <!-- Pill 2 -->
    <rect x="177" width="160" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="197" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Data Structures</text>

    <!-- Pill 3 -->
    <rect x="349" width="150" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="369" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Control Flow</text>

    <!-- Pill 4 -->
    <rect x="511" width="150" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="531" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Clean Practice</text>
  </g>

  <!-- Author & Branding Footer -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Crafted with precision by <tspan fill="#e2e8f0" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek
    </text>
  </g>

  <!-- Code Preview Card Right Side -->
  <g transform="translate(780, 85)">
    <rect width="340" height="250" rx="12" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
    <!-- Window controls -->
    <circle cx="22" cy="22" r="5" fill="#ef4444"/>
    <circle cx="38" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="22" r="5" fill="#10b981"/>
    <text x="80" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">solution.py</text>
    
    <!-- Code Lines -->
    <text x="22" y="65" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="13">def <tspan fill="#38bdf8">solve</tspan><tspan fill="#94a3b8">(nums: list[int]) -&gt; int:</tspan></text>
    <text x="42" y="95" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12"># Sliding window &amp; memo</text>
    <text x="42" y="125" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13">seen = set()</text>
    <text x="42" y="155" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="13">for <tspan fill="#e2e8f0">n</tspan> in <tspan fill="#e2e8f0">nums:</tspan></text>
    <text x="62" y="185" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13">if n in seen: return n</text>
    <text x="62" y="215" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13">seen.add(n)</text>
  </g>
</svg>
