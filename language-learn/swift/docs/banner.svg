<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgSwift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="50%" stop-color="#141117"/>
      <stop offset="100%" stop-color="#0d0b12"/>
    </linearGradient>
    <linearGradient id="swiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05138"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05138" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff9500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgSwift)"/>
  
  <circle cx="160" cy="120" r="160" fill="#f05138" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1040" cy="300" r="160" fill="#ff9500" fill-opacity="0.10" filter="url(#glow)"/>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(80, 60)">
    <rect width="250" height="30" rx="15" fill="#26151a" stroke="#48222b" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#f05138"/>
    <text x="32" y="20" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">END-TO-END IOS JOURNEY</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    Swift &amp; iOS <tspan fill="url(#swiftGrad)">Developer Mastery</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Curated curriculum: Swift concurrency, SwiftUI, Combine, UIKit, architecture &amp; capstone builds.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(80, 255)">
    <rect width="165" height="38" rx="10" fill="#1b1219" stroke="#36202c" stroke-width="1"/>
    <text x="18" y="24" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Swift 6 &amp; Concurrency</text>

    <rect x="177" width="145" height="38" rx="10" fill="#1b1219" stroke="#36202c" stroke-width="1"/>
    <text x="197" y="24" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">SwiftUI &amp; UIKit</text>

    <rect x="334" width="165" height="38" rx="10" fill="#1b1219" stroke="#36202c" stroke-width="1"/>
    <text x="354" y="24" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Mentor PR Review</text>

    <rect x="511" width="155" height="38" rx="10" fill="#1b1219" stroke="#36202c" stroke-width="1"/>
    <text x="531" y="24" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">3 Capstone Apps</text>
  </g>

  <!-- Visual Card Right Side: Roadmap milestones -->
  <g transform="translate(810, 75)">
    <rect width="310" height="270" rx="16" fill="#0f0c13" stroke="#2b1a26" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#f05138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">CURRICULUM MILESTONES</text>
    
    <g transform="translate(24, 60)">
      <rect width="262" height="52" rx="10" fill="#1c131d"/>
      <circle cx="26" cy="26" r="14" fill="#f05138"/>
      <text x="20" y="31" fill="#ffffff" font-size="12">01</text>
      <text x="52" y="24" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Fundamentals &amp; CLI</text>
      <text x="52" y="40" fill="#ff9500" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Bookshelf CLI &amp; Generics</text>
    </g>

    <g transform="translate(24, 122)">
      <rect width="262" height="52" rx="10" fill="#1c131d"/>
      <circle cx="26" cy="26" r="14" fill="#5856d6"/>
      <text x="20" y="31" fill="#ffffff" font-size="12">C1</text>
      <text x="52" y="24" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Kumbara · Fintech</text>
      <text x="52" y="40" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Personal finance capstone</text>
    </g>

    <g transform="translate(24, 184)">
      <rect width="262" height="52" rx="10" fill="#1c131d"/>
      <circle cx="26" cy="26" r="14" fill="#34c759"/>
      <text x="20" y="31" fill="#ffffff" font-size="12">C2</text>
      <text x="52" y="24" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Vitrin · E-Commerce</text>
      <text x="52" y="40" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Modular UIKit + SwiftUI</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Engineered by <tspan fill="#f3f4f6" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek/swift-learn
    </text>
  </g>
</svg>
