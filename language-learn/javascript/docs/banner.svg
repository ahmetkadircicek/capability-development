<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgJS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="50%" stop-color="#14130d"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgJS)"/>
  
  <circle cx="160" cy="120" r="160" fill="#facc15" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="1040" cy="300" r="160" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)"/>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(80, 60)">
    <rect width="210" height="30" rx="15" fill="#24210e" stroke="#483f17" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#facc15"/>
    <text x="32" y="20" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">ES6+ &amp; DOM LAB</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    JavaScript <tspan fill="url(#yellowGrad)">Core Mastery</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    DOM traversal, closures, event loops, async promises, prototypes and high-order methods.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(80, 255)">
    <rect width="160" height="38" rx="10" fill="#181710" stroke="#2e2b19" stroke-width="1"/>
    <text x="18" y="24" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">ECMAScript 2024</text>

    <rect x="172" width="150" height="38" rx="10" fill="#181710" stroke="#2e2b19" stroke-width="1"/>
    <text x="192" y="24" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">DOM Tree API</text>

    <rect x="334" width="165" height="38" rx="10" fill="#181710" stroke="#2e2b19" stroke-width="1"/>
    <text x="354" y="24" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Closures &amp; Scope</text>

    <rect x="511" width="165" height="38" rx="10" fill="#181710" stroke="#2e2b19" stroke-width="1"/>
    <text x="531" y="24" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Async / Promises</text>
  </g>

  <!-- Visual Card Right Side: Code execution simulation -->
  <g transform="translate(810, 75)">
    <rect width="310" height="270" rx="16" fill="#08090d" stroke="#242217" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">EXECUTION CONTEXT</text>
    
    <g transform="translate(24, 60)">
      <rect width="262" height="52" rx="10" fill="#151512"/>
      <circle cx="26" cy="26" r="14" fill="#eab308"/>
      <text x="20" y="31" fill="#0f172a" font-size="11" font-weight="700">fn</text>
      <text x="52" y="24" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">debounce(callback, 300)</text>
      <text x="52" y="40" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Closure memoizing timer ID</text>
    </g>

    <g transform="translate(24, 122)">
      <rect width="262" height="52" rx="10" fill="#151512"/>
      <circle cx="26" cy="26" r="14" fill="#38bdf8"/>
      <text x="20" y="31" fill="#0f172a" font-size="11" font-weight="700">=&gt;</text>
      <text x="52" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Promise.allSettled()</text>
      <text x="52" y="40" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Concurrent microtask queue</text>
    </g>

    <g transform="translate(24, 184)">
      <rect width="262" height="52" rx="10" fill="#151512"/>
      <circle cx="26" cy="26" r="14" fill="#10b981"/>
      <text x="20" y="31" fill="#0f172a" font-size="11" font-weight="700">🌳</text>
      <text x="52" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Document Object Model</text>
      <text x="52" y="40" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Element relation &amp; events</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Engineered by <tspan fill="#fef08a" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek/javascript-learn
    </text>
  </g>
</svg>
