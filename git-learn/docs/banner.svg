<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgGit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="50%" stop-color="#161011"/>
      <stop offset="100%" stop-color="#0c0a10"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05032"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05032" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgGit)"/>
  
  <circle cx="160" cy="120" r="160" fill="#f05032" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1040" cy="300" r="160" fill="#f59e0b" fill-opacity="0.08" filter="url(#glow)"/>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(80, 60)">
    <rect width="230" height="30" rx="15" fill="#291414" stroke="#4a1e1e" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#f05032"/>
    <text x="32" y="20" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">VERSION CONTROL &amp; CLI</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    Git &amp; CLI <tspan fill="url(#gitGrad)">Workflow Handbook</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Practical reference: branching models, rebase strategies, SSH setup, and command-line mastery.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(80, 255)">
    <rect width="150" height="38" rx="10" fill="#1b1214" stroke="#381d20" stroke-width="1"/>
    <text x="20" y="24" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Git 2.40+</text>

    <rect x="162" width="165" height="38" rx="10" fill="#1b1214" stroke="#381d20" stroke-width="1"/>
    <text x="182" y="24" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Branching &amp; PRs</text>

    <rect x="339" width="165" height="38" rx="10" fill="#1b1214" stroke="#381d20" stroke-width="1"/>
    <text x="359" y="24" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Rebase &amp; Stash</text>

    <rect x="516" width="160" height="38" rx="10" fill="#1b1214" stroke="#381d20" stroke-width="1"/>
    <text x="536" y="24" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">CLI Shortcuts</text>
  </g>

  <!-- Visual Card Right Side: Interactive Git Branch Tree -->
  <g transform="translate(810, 75)">
    <rect width="310" height="270" rx="16" fill="#0b0809" stroke="#2b1517" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#f05032" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">BRANCHING TOPOLOGY</text>
    
    <!-- Main line (cyan/green) -->
    <line x1="50" y1="80" x2="50" y2="240" stroke="#10b981" stroke-width="3"/>
    
    <!-- Feature branch line (orange) -->
    <path d="M 50 110 C 90 110, 110 140, 110 170 C 110 200, 90 220, 50 220" fill="none" stroke="#f05032" stroke-width="3" stroke-dasharray="4 4"/>
    
    <!-- Commits on main -->
    <circle cx="50" cy="80" r="7" fill="#10b981"/>
    <text x="68" y="85" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">c124a9 (main)</text>

    <circle cx="50" cy="140" r="7" fill="#10b981"/>
    <text x="125" y="145" fill="#f05032" font-family="'JetBrains Mono', monospace" font-size="11">feat/auth</text>

    <!-- Commit on feature branch -->
    <circle cx="110" cy="170" r="7" fill="#f05032"/>
    <text x="125" y="175" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">b49d8e commit</text>

    <!-- Merge commit on main -->
    <circle cx="50" cy="220" r="7" fill="#10b981"/>
    <text x="68" y="225" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">Merge PR #42</text>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Engineered by <tspan fill="#fecaca" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek/git_learn
    </text>
  </g>
</svg>
