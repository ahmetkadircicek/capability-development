<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgFlutter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54c5f8"/>
      <stop offset="100%" stop-color="#02569b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgFlutter)"/>
  
  <circle cx="160" cy="120" r="160" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1040" cy="300" r="160" fill="#6366f1" fill-opacity="0.10" filter="url(#glow)"/>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(80, 60)">
    <rect width="210" height="30" rx="15" fill="#112236" stroke="#1d3b5e" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#38bdf8"/>
    <text x="32" y="20" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">FLUTTER DRILLS &amp; LAB</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    Flutter <tspan fill="url(#flutterGrad)">Practice Workshop</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Curated mobile drills, IKEA store app clone, custom OTP widgets, and layout patterns.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(80, 255)">
    <rect width="150" height="38" rx="10" fill="#101d30" stroke="#1f314d" stroke-width="1"/>
    <text x="18" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Flutter 3 &amp; Dart</text>

    <rect x="162" width="155" height="38" rx="10" fill="#101d30" stroke="#1f314d" stroke-width="1"/>
    <text x="182" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">IKEA Store Clone</text>

    <rect x="329" width="165" height="38" rx="10" fill="#101d30" stroke="#1f314d" stroke-width="1"/>
    <text x="349" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">OTP Digit Widget</text>

    <rect x="506" width="165" height="38" rx="10" fill="#101d30" stroke="#1f314d" stroke-width="1"/>
    <text x="526" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Text Themes &amp; UI</text>
  </g>

  <!-- Visual Card Right Side: Drills List -->
  <g transform="translate(810, 75)">
    <rect width="310" height="270" rx="16" fill="#09101d" stroke="#1a273e" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">LAB PROJECTS</text>
    
    <g transform="translate(24, 60)">
      <rect width="262" height="65" rx="10" fill="#122036"/>
      <circle cx="28" cy="32" r="16" fill="#0284c7"/>
      <text x="22" y="37" fill="#ffffff" font-size="13">🛒</text>
      <text x="54" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">IKEA Store Clone</text>
      <text x="54" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Catalog grid, typography &amp; cart</text>
    </g>

    <g transform="translate(24, 138)">
      <rect width="262" height="65" rx="10" fill="#122036"/>
      <circle cx="28" cy="32" r="16" fill="#818cf8"/>
      <text x="22" y="37" fill="#ffffff" font-size="13">🔢</text>
      <text x="54" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Custom OTP Widget</text>
      <text x="54" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">FocusNode chain &amp; auto-submit</text>
    </g>

    <g transform="translate(24, 215)">
      <rect width="262" height="34" rx="8" fill="#1e293b"/>
      <text x="60" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Explore Project Demos →</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Engineered by <tspan fill="#e2e8f0" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek/flutter-learn
    </text>
  </g>
</svg>
