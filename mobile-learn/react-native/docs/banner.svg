<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgRN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61dafb" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgRN)"/>
  
  <circle cx="160" cy="120" r="160" fill="#61dafb" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="1040" cy="300" r="160" fill="#0284c7" fill-opacity="0.10" filter="url(#glow)"/>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(80, 60)">
    <rect width="230" height="30" rx="15" fill="#132338" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#61dafb"/>
    <text x="32" y="20" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">EXPO &amp; REACT NATIVE LAB</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    React Native <tspan fill="url(#cyanGrad)">Learning Lab</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Component lifecycle, hooks, Expo Router tabs navigation, and cross-platform UI patterns.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(80, 255)">
    <rect width="160" height="38" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">React Native 0.74</text>

    <rect x="172" width="140" height="38" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
    <text x="192" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Expo Router</text>

    <rect x="324" width="150" height="38" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
    <text x="344" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">TypeScript</text>

    <rect x="486" width="160" height="38" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
    <text x="506" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Coursera Track</text>
  </g>

  <!-- Visual Card Right Side -->
  <g transform="translate(810, 75)">
    <rect width="310" height="270" rx="16" fill="#090f1a" stroke="#1b2a40" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#61dafb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">COURSE MODULES</text>
    
    <g transform="translate(24, 60)">
      <rect width="262" height="52" rx="10" fill="#142136"/>
      <circle cx="26" cy="26" r="14" fill="#0284c7"/>
      <text x="20" y="31" fill="#ffffff" font-size="12">01</text>
      <text x="52" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Core Components &amp; Props</text>
      <text x="52" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">View, Text, Image, StyleSheet</text>
    </g>

    <g transform="translate(24, 122)">
      <rect width="262" height="52" rx="10" fill="#142136"/>
      <circle cx="26" cy="26" r="14" fill="#61dafb"/>
      <text x="20" y="31" fill="#0f172a" font-size="12">02</text>
      <text x="52" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">File-Based Tab Navigation</text>
      <text x="52" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Expo Router stack &amp; layout</text>
    </g>

    <g transform="translate(24, 184)">
      <rect width="262" height="52" rx="10" fill="#142136"/>
      <circle cx="26" cy="26" r="14" fill="#818cf8"/>
      <text x="20" y="31" fill="#ffffff" font-size="12">03</text>
      <text x="52" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Custom Hooks &amp; State</text>
      <text x="52" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">useThemeColor &amp; useColorScheme</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Engineered by <tspan fill="#e2e8f0" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek/react-native-learn
    </text>
  </g>
</svg>
