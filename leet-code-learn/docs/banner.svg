<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgLeet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b13"/>
      <stop offset="50%" stop-color="#14111e"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="leetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa116"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffa116" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgLeet)"/>
  
  <circle cx="160" cy="120" r="160" fill="#ffa116" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="1040" cy="300" r="160" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)"/>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(80, 60)">
    <rect width="240" height="30" rx="15" fill="#24190c" stroke="#4a3014" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#ffa116"/>
    <text x="32" y="20" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">ALGORITHMS &amp; DATA STRUCTURES</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    LeetCode <tspan fill="url(#leetGrad)">Solutions Lab</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Clean, tested solutions in Python &amp; JavaScript with time &amp; space complexity analysis.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(80, 255)">
    <rect width="130" height="38" rx="10" fill="#141824" stroke="#222b3d" stroke-width="1"/>
    <text x="18" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Python 3</text>

    <rect x="142" width="150" height="38" rx="10" fill="#141824" stroke="#222b3d" stroke-width="1"/>
    <text x="162" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">JavaScript ES6+</text>

    <rect x="304" width="165" height="38" rx="10" fill="#141824" stroke="#222b3d" stroke-width="1"/>
    <text x="324" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Big-O Analysis</text>

    <rect x="481" width="165" height="38" rx="10" fill="#141824" stroke="#222b3d" stroke-width="1"/>
    <text x="501" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Sliding Window</text>
  </g>

  <!-- Visual Card Right Side: Complexity Matrix -->
  <g transform="translate(810, 75)">
    <rect width="310" height="270" rx="16" fill="#090d16" stroke="#1d273a" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#ffa116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">COMPLEXITY BENCHMARKS</text>
    
    <g transform="translate(24, 60)">
      <rect width="262" height="52" rx="10" fill="#121826"/>
      <circle cx="26" cy="26" r="14" fill="#10b981"/>
      <text x="20" y="31" fill="#0f172a" font-size="11" font-weight="700">1</text>
      <text x="52" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Two Sum · Hash Map</text>
      <text x="52" y="40" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">Time: O(n) · Space: O(n)</text>
    </g>

    <g transform="translate(24, 122)">
      <rect width="262" height="52" rx="10" fill="#121826"/>
      <circle cx="26" cy="26" r="14" fill="#38bdf8"/>
      <text x="20" y="31" fill="#0f172a" font-size="11" font-weight="700">3</text>
      <text x="52" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Longest Substring</text>
      <text x="52" y="40" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Sliding Window · O(n)</text>
    </g>

    <g transform="translate(24, 184)">
      <rect width="262" height="52" rx="10" fill="#121826"/>
      <circle cx="26" cy="26" r="14" fill="#f59e0b"/>
      <text x="20" y="31" fill="#0f172a" font-size="11" font-weight="700">70</text>
      <text x="52" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Climbing Stairs</text>
      <text x="52" y="40" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">DP / Fibonacci · O(n)</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Engineered by <tspan fill="#fef08a" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek/leetcode
    </text>
  </g>
</svg>
